<!doctype html>
<html lang="en">
<head>
  <!-- Meta -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>

  <title>Book Info</title>

  <style>
    /* ----------  Root & Body  ---------- */
    :root {
      --glass-bg: rgba(255,255,255,0.8);
      --glass-blur: 12px;
      --accent: #7c3aed;        /* Indigo-500 */
      --accent-light: #ede9fe;  /* Indigo-100 */
    }
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: grid;
      place-content: center;
      background: url('https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=2100&q=80') center/cover fixed;
      padding: 2rem;
    }

    /* ----------  Glass Card Wrapper  ---------- */
    .card-glass {
      backdrop-filter: blur(var(--glass-blur));
      background: var(--glass-bg);
      border-radius: 1.25rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      padding: 2.5rem 2rem;
      width: min(92vw, 1100px);
    }

    h1 {
      font-weight: 600;
      letter-spacing: 0.5px;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    /* ----------  Table Styling  ---------- */
    .styled-table {
      overflow: hidden;
      border-radius: 0.75rem;
    }
    .styled-table thead th {
      background: var(--accent);
      color: #fff;
      text-align: center;
    }
    .styled-table tbody tr {
      transition: background 0.3s ease;
    }
    .styled-table tbody tr:nth-child(even) {
      background: var(--accent-light);
    }
    .styled-table tbody tr:hover {
      background: rgba(124,58,237,0.15);
    }
    .styled-table td,
    .styled-table th {
      padding: 0.9rem 0.75rem;
      text-align: center;
      vertical-align: middle;
    }

    /* ----------  Button Styling  ---------- */
    .add-btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.6rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 30px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .add-btn:hover {
      background-color: #5b21b6;
      text-decoration: none;
      color: #fff;
    }

    .no-record {
      font-style: italic;
      color: #888;
    }
  </style>
</head>

<body>
  <div class="card-glass">
    <h1>Online Books Management</h1>

    <div class="table-responsive styled-table">
      <table class="table table-bordered mb-0">
        <thead>
          <tr>
            <th>Book Id</th>
            <th>Book Name</th>
            <th>Book Price</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <!-- Example static row; Thymeleaf tags for dynamic content -->
          <tr th:each="book : ${books}">
            <td th:text="${book.bookId}">101</td>
            <td th:text="${book.bookName}">Java in Depth</td>
            <td th:text="${book.bookPrice}">550</td>
            <td>
              <a th:href="@{/edit?(bookId=${book.bookId})}" class="btn btn-secondary btn-sm">Edit</a>
              <a th:href="@{/delete?(bookId=${book.bookId})}"
                 class="btn btn-danger btn-sm"
                 onclick="return confirmDelete();">Delete</a>
            </td>
          </tr>

          <tr th:if="${books.isEmpty()}">
            <td colspan="4" class="text-center no-record">No Record Found</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Add Book Button -->
    <div class="text-center">
      <a href="index" class="add-btn">➕ Add Book</a>
    </div>
  </div>

  <!-- Delete confirmation -->
  <script>
    const confirmDelete = () =>
      confirm('Are you sure you want to delete this book?');
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
