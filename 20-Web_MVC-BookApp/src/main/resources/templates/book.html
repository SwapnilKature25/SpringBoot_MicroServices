<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Web MVC Proj</title>
  </head>
  <body>
	<div class="container">
	        <h1>Book Info</h1>
			<a href="index" class="btn btn-primary mb-3 mt-3">Add New Book</a>
			        <table class="table table-bordereyed">
			            <thead>
			                <tr>
			                    <th>Book Id</th>
			                    <th>Book Name</th>
			                    <th>Book Price</th>
			                    <th>Action</th>
			                </tr>
			            </thead>
			            <tbody>
			                <tr th:each="book : ${books}">
			                    <td th:text="${book.bookId}"></td>
			                    <td th:text="${book.bookName}"></td>
			                    <td th:text="${book.bookPrice}"></td>
			                    <td>
			                       <a th:href="@{/edit?(bookId=${book.bookId})}" class="btn btn-secondary">EDIT</a>
			                        <a th:href="@{/delete?(bookId=${book.bookId})}" 
										class="btn btn-danger"
										onclick="return confirmDelete()" >DELETE</a>
			                    </td>
			                </tr>
							
							<tr th:if="${books.isEmpty()}">
							      <td colspan="4">No Record found</td>
							 </tr>
			            </tbody>
			        </table>
	</div>
    <!-- Optional JavaScript; choose one of the two! -->
	
	<script type="text/javascript">
	            function confirmDelete(){
	                return confirm("Are you sure, to delete?");
	            }
	        </script>

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    -->
  </body>
</html>
