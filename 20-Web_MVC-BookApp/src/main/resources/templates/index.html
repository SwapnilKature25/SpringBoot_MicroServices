<!doctype html>
<html lang="en">
<head>
  <!-- Meta -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <title>Book Form | Web MVC Proj</title>

  <style>
    :root {
      --glass-bg: rgba(255,255,255,0.85);
      --glass-blur: 14px;
      --accent: #7c3aed;
    }

	body {
	    margin: 0;
	    font-family: 'Poppins', sans-serif;
	    min-height: 100vh;
		background: url('https://images.unsplash.com/photo-1557804506-669a67965ba0?ixlib=rb-4.0.3&auto=format&fit=crop&w=2100&q=80') 
		            no-repeat center center fixed;

	    background-size: cover;
	    display: flex;
	    justify-content: center;
	    align-items: center;
	    padding: 2rem;
	  }

    .glass-form {
      backdrop-filter: blur(var(--glass-blur));
      background: var(--glass-bg);
      padding: 2rem 2.5rem;
      border-radius: 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      width: min(90vw, 600px);
    }

    h2 {
      text-align: center;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .form-label {
      font-weight: 500;
    }

    .msg {
      text-align: center;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .msg.success {
      color: green;
    }

    .msg.error {
      color: red;
    }

    .form-control {
      border-radius: 0.5rem;
    }

    .submit-btn {
      width: 100%;
      font-weight: 500;
      border-radius: 30px;
    }

    .bottom-link {
      margin-top: 1.5rem;
      text-align: center;
    }

    .bottom-link a {
      text-decoration: none;
      font-weight: 600;
      color: var(--accent);
      transition: color 0.3s;
    }

    .bottom-link a:hover {
      color: #5b21b6;
    }
  </style>
</head>

<body>
  <div class="glass-form">
    <h2>ADD BOOK</h2>

    <p th:text="${succMsg}" class="msg success"></p>
    <p th:text="${errMsg}" class="msg error"></p>

	<!-- th:object  - Form to object mapping  -->
    <form th:action="@{/book}" th:object="${book}" method="post">
      <div class="mb-3">
        <label class="form-label">Book Name</label>
        <input type="text" th:field="*{bookName}" class="form-control" required>
        <input type="hidden" th:field="*{bookId}"> <!-- sending bookId as hidden variable -->
      </div>

      <div class="mb-3">
		<!-- th:field  -  field to java class variable mapping  -->
        <label class="form-label">Book Price</label>
        <input type="number" th:field="*{bookPrice}" class="form-control" required>
      </div>

      <div>
        <input type="submit" value="SAVE" class="btn btn-primary submit-btn">
      </div>
    </form>

    <div class="bottom-link">
      <a href="books">📚 View All Books</a>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
